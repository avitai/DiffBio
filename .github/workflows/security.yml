name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up DiffBio
        uses: ./.github/actions/setup-diffbio
        with:
          python-version: "3.12"
          cache-suffix: security
          linux-editable-target: ".[dev]"

      # Every extra the lock resolves, in groups that respect [tool.uv] conflicts, each audited
      # by a pinned pip-audit with a fresh advisory cache. Ignored advisories and their reasons
      # live in [tool.substrax.audit-lock.ignore] in pyproject.toml; the action also fails on an
      # ignore that no advisory matches any more.
      - name: Audit the locked dependencies
        uses: avitai/substrax/.github/actions/audit-lock@13e98b78127606be04437bd7c5de894fb765a28e

      # Runs after a failed audit too, so one run reports both scans; either failure fails the job.
      - name: Bandit
        if: ${{ !cancelled() }}
        run: uv run --with bandit bandit -c pyproject.toml -r src/diffbio/ -f json -o bandit-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
