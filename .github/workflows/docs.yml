name: Documentation

# Read the Docs builds and hosts the documentation (.readthedocs.yaml). This workflow only checks
# that the site builds strictly, so a change that breaks it fails before it reaches Read the Docs.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'src/diffbio/**'
      - '.github/actions/setup-diffbio/action.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'src/diffbio/**'
      - '.github/actions/setup-diffbio/action.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up DiffBio docs environment
        uses: ./.github/actions/setup-diffbio
        with:
          python-version: '3.12'
          cache-suffix: docs-py312
          linux-editable-target: ".[docs]"

      - name: Build documentation
        run: uv run mkdocs build --clean --strict
