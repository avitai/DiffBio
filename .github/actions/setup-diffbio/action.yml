name: Setup DiffBio
description: Set up Python and uv, install the requested editable target, and export PYTHONPATH.

inputs:
  python-version:
    description: Python version to install.
    required: true
  cache-suffix:
    description: Cache suffix for uv.
    required: true
  linux-editable-target:
    description: Editable target to install on Linux runners.
    required: true
  macos-editable-target:
    description: Editable target override for macOS runners.
    required: false
    default: ""
  extra-packages:
    description: Extra packages to install after the editable target.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "0.11.3"
        enable-cache: true
        cache-suffix: ${{ inputs.cache-suffix }}

    - name: Create virtual environment
      shell: bash
      run: uv venv --python "${{ inputs.python-version }}" --python-preference only-system --no-python-downloads

    - name: Install DiffBio environment
      shell: bash
      env:
        UV_CONCURRENT_DOWNLOADS: "4"
        # uv sync is a project command and selects its own interpreter; it does not
        # inherit the one `uv venv --python` just created. Without these it resolved
        # against CPython 3.14 and refused the lock, because tensorflow 2.20.0 has no
        # cp314 wheel. The same three variables are exported for later steps further
        # down; they are needed here too, before the first uv sync runs.
        UV_PYTHON: ${{ inputs.python-version }}
        UV_PYTHON_DOWNLOADS: never
        UV_PYTHON_PREFERENCE: only-system
      run: |
        set -euo pipefail

        editable_target="${{ inputs.linux-editable-target }}"
        if [[ "${{ runner.os }}" == "macOS" && -n "${{ inputs.macos-editable-target }}" ]]; then
          editable_target="${{ inputs.macos-editable-target }}"
        fi

        # Resolve from uv.lock rather than from the pyproject floors. Installing
        # unpinned let every tool drift to its newest release between runs, so a
        # run could fail on a dependency change no commit had made.
        sync_args=(--locked)
        if [[ "$editable_target" == *"["* ]]; then
          extras="${editable_target#*[}"
          extras="${extras%]}"
          IFS=',' read -ra extra_names <<< "$extras"
          for extra in "${extra_names[@]}"; do
            sync_args+=(--extra "${extra// /}")
          done
        fi

        for attempt in 1 2 3 4 5; do
          if uv sync "${sync_args[@]}"; then
            break
          fi

          if [[ "$attempt" -eq 5 ]]; then
            echo "Failed to sync $editable_target after 5 attempts" >&2
            exit 1
          fi

          delay=$((attempt * 10))
          echo "Sync attempt $attempt failed, retrying in ${delay} seconds..." >&2
          sleep "$delay"
        done

        if [[ -n "${{ inputs.extra-packages }}" ]]; then
          uv pip install ${{ inputs.extra-packages }}
        fi

    - name: Export repo-local environment
      shell: bash
      run: |
        {
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)"
          echo "UV_PYTHON=${{ inputs.python-version }}"
          echo "UV_PYTHON_DOWNLOADS=never"
          echo "UV_PYTHON_PREFERENCE=only-system"
          echo "UV_CONCURRENT_DOWNLOADS=4"
          echo "JAX_PLATFORMS=cpu"
        } >> "$GITHUB_ENV"
